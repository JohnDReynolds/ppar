name: ppar compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MPLBACKEND: Agg

concurrency:
  group: ppar-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11.9"
            check: product
          - python-version: "3.12.1"
            check: product
          - python-version: "3.13"
            check: tests
          - python-version: "3.14"
            check: tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Create project environment
        run: python -m venv .venv

      - name: Install constrained project dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install \
            --constraint constraints/ci.txt \
            --editable ".[dev]"

      - name: Run complete product checks
        if: matrix.check == 'product'
        run: ./.venv/bin/python scripts/check_project.py

      - name: Run runtime compatibility tests
        if: matrix.check == 'tests'
        run: ./.venv/bin/python -m pytest -q
