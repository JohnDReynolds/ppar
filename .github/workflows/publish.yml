name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: read

  publish:
    needs: release-candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Download the validated universal wheel
        uses: actions/download-artifact@v5
        with:
          name: ppar-universal-wheel
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
