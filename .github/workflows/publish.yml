name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.1"

      - name: Build and validate the universal wheel
        run: |
          python -m pip install \
            --constraint constraints/ci.txt \
            build setuptools twine
          python -m build --wheel --no-isolation
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test -f dist/ppar-0.2.0-py3-none-any.whl
          python -m twine check dist/ppar-0.2.0-py3-none-any.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
