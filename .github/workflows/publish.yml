name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: read

  publish:
    needs: release-candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.1"

      - name: Build and validate the universal wheel
        shell: bash
        run: |
          python -m pip install \
            --constraint constraints/ci.txt \
            build setuptools twine
          python -m build --wheel --no-isolation
          mapfile -t wheels < <(find dist -maxdepth 1 -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          case "${wheels[0]}" in
            *-py3-none-any.whl) ;;
            *) exit 1 ;;
          esac
          python -m twine check "${wheels[0]}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
