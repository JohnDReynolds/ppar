name: ppar release candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.1"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt

      - name: Create project environment
        run: python -m venv .venv

      - name: Install constrained project dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install \
            --constraint constraints/ci.txt \
            --editable ".[dev]"

      - name: Run the release-candidate gate
        run: ./.venv/bin/python scripts/check_release_candidate.py
