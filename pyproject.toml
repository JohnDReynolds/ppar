[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ppar"
version = "0.2.1"
description = "Portfolio performance attribution, contribution, and ex-post risk analytics."
authors = [{ name = "John Reynolds", email = "jjjkreynolds@gmail.com" }]
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = [
    "portfolio",
    "performance",
    "analytics",
    "attribution",
    "risk",
    "benchmark",
    "Axys",
    "APX",
]
requires-python = ">=3.11.9,<3.15"
dependencies = [
    "matplotlib>=3.8.2",
    "numpy>=1.26.4",
    "pillow>=10.0",
    "polars>=1.24.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pylint>=4.0",
    "pyright>=1.1.409",
    "setuptools>=77.0.0",
    "twine>=6.0",
    "types-seaborn",
]

[project.scripts]
ppar = "ppar.cli:main"

[project.urls]
Repository = "https://github.com/JohnDReynolds/ppar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ppar = [
    "py.typed",
    "templates/axys_apx/*.md",
    "templates/axys_apx/*.py",
    "templates/axys_apx/input/*.csv",
    "templates/generic/*.md",
    "templates/generic/*.py",
    "templates/generic/input/*.csv",
    "templates/generic/input/classifications/*.csv",
    "templates/generic/input/mappings/*.csv",
    "templates/generic/input/performance/*.csv",
]

[tool.mypy]
python_version = "3.11"
files = ["src/ppar", "scripts"]
strict = true
show_error_codes = true
warn_unused_configs = true

[tool.pyright]
include = ["src/ppar", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pylint.main]
persistent = false
py-version = "3.11"

[tool.pylint.format]
max-line-length = 99

[tool.pylint."messages control"]
enable = [
    "unused-import",
    "unused-variable",
]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-branches = 40
max-locals = 30
max-attributes = 12
min-public-methods = 0
