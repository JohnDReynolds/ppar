# =========================
# ppar Axys Configuration
# =========================
# This file tells ppar where to find your Axys exports and how to interpret
# the columns in those files.
#
# General Rules:
# - File paths may be absolute or relative to this file.
# - Vendor-specific headings are mapped explicitly below.
# - If a mapping is omitted, only the exact normalized column name is accepted.
# - Fields ending in "_column" contain Axys export column names.
# - Unknown fields are rejected so spelling mistakes fail loudly.


# Inclusive reporting window and classification loaded with each portfolio.
from_date: 2024-01-01
thru_date: 2024-12-31
classification: Country


# =========================
# Portfolio Performance Export
# =========================
files:
  portfolio_performance:
    path: snapshots/axys_a/portperf.csv
    columns:
      from_date: FROM_DATE
      thru_date: THRU_DATE
      portfolio_code: PORTFOLIO_CODE
      portfolio_name: PORTFOLIO_NAME
      portfolio_return: PORT_RETURN
      begin_market_value: BEGIN_MV
      end_market_value: END_MV
      flow: FLOW
      income: INCOME
      gain_loss: GAIN_LOSS
      period_id: PERIOD_ID


# =========================
# Security Performance Export
# =========================
  security_performance:
    path: snapshots/axys_a/secperf.csv
    columns:
      from_date: FROM_DATE
      thru_date: THRU_DATE
      identifier: SECURITY_ID
      security_name: SECURITY_NAME
      portfolio_code: PORTFOLIO_CODE
      security_return: SEC_RETURN
      weight: BEGIN_WEIGHT
      contribution: CONTRIBUTION
      begin_market_value: BEGIN_MV
      end_market_value: END_MV
      income: INCOME
      gain_loss: GAIN_LOSS
      period_id: PERIOD_ID

  holdings:
    columns:
      portfolio_code: PORT
      identifier: SEC
      holding_date: HOLDING_DATE
      quantity: QTY
      price: PRICE
      market_value: MV
      cost: COST
      accrued: ACCRUED
      currency: CURRENCY

  transactions:
    columns:
      portfolio_code: PORT
      identifier: SEC
      transaction_id: TRANSACTION_ID
      transaction_date: TRANSACTION_DATE
      settlement_date: SETTLE_DATE
      transaction_code: TRAN
      transaction_security_type: SEC_TYPE
      source_destination_type: SRC_DEST_TYPE
      source_destination_symbol: SRC_DEST_SYMBOL
      special_security_type: SPECIAL_SEC_TYPE
      special_security_symbol: SPECIAL_SEC_SYMBOL
      transaction_category: TRANSACTION_CATEGORY
      cash_flow_sign: CASH_FLOW_SIGN
      performance_flow_sign: PERFORMANCE_FLOW_SIGN
      quantity: QTY
      price: PRICE
      amount: AMOUNT
      commission: COMMISSION
      broker: BROKER

# =========================
# Security Master
# =========================
  security_master:
    path: snapshots/axys_a/secmast.csv
    columns:
      # Security identifier matched to security performance rows.
      identifier_column: SECURITY_ID

      # Security display name used in reports.
      security_name: SECURITY_NAME

# =========================
# Classifications
# =========================
# Optional: Lookup Table Classifications
# Add entries here when your Axys grouping codes need to be translated through
# a separate lookup export. Groupings already present on the security master
# can usually be configured in the mappings section instead.
classifications:
  # Optional lookup-table-based sector classification.
  SectorLookup:
    file_path: snapshots/axys_a/classification_lookup.csv
    display_name: Sector
    identifier_column: CODE
    name_column: DESCRIPTION
    filter_column: CLASSIFICATION_TYPE
    filter_value: SECTOR
    mapping: Sector

# =========================
# Mappings
# =========================
# Groupings From The Security Master
# Each mapping tells ppar how to roll securities up to a grouping such as
# sector, country, currency, or asset class.
mappings:
  # Security -> asset class.
  AssetClass:
    classification_column: ASSET_CLASS_CODE
    display_name_column: ASSET_CLASS_DESC

  # Security -> country.
  Country:
    classification_column: COUNTRY_CODE
    display_name_column: COUNTRY_DESC

  # Security -> currency.
  Currency:
    classification_column: CURRENCY_CODE
    display_name_column: CURRENCY_DESC

  # Security -> industry.
  Industry:
    classification_column: INDUSTRY_CODE
    display_name_column: INDUSTRY_DESC

  # Security -> sector.
  Sector:
    classification_column: SECTOR_CODE
    display_name_column: SECTOR_DESC
